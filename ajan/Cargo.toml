[package]
name = "gozcu-ajan"
version = "0.1.0"
edition = "2021"
description = "Gözcü ajanı: makinenin donanım, AI ve ısı durumunu Tailscale ağına JSON olarak verir"
license = "MIT"

[[bin]]
name = "gozcu-ajan"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "=0.33.1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
